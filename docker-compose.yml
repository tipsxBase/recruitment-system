version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment_system
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: recruitment-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway 服务
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: recruitment-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - GATEWAY_PORT=8080
      - SERVER_BASE_URL=http://server:8090
      - JWT_SECRET=recruitment-gateway-secret-key
      - JWT_EXPIRES_IN=24h
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./apps/gateway:/app
      - /app/node_modules
    command: ["pnpm", "start:dev"]

  # Server 服务
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: recruitment-server
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=development
      - PORT=8090
      - DATABASE_URL=postgresql://recruitment_user:recruitment_password@postgres:5432/recruitment_system
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/server:/app
      - /app/node_modules
    command: ["pnpm", "start:dev"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web 前端
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: recruitment-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: ["pnpm", "dev"]

volumes:
  postgres_data:
  redis_data:
